[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-papa"
version = "0.4.0"
description = "Assistant personnel local-first pour Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "playwright>=1.55,<2.0",
  "httpx>=0.28,<1.0",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
jarvis-papa = "jarvis_papa.main:run"
jarvis-native-host = "jarvis_papa.native_host:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_papa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/jarvis_papa/app.py" = ["F401"]
"src/jarvis_papa/dashboard.py" = ["I001"]

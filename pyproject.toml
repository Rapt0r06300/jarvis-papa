[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-papa"
version = "0.7.0"
description = "Assistant personnel local-first natif pour Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "playwright>=1.55,<2.0",
  "httpx>=0.28,<1.0",
  "pypdf>=6.0,<7.0",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "PySide6>=6.9,<7.0; sys_platform == 'win32'",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]
build = [
  "pyinstaller>=6.22,<7.0",
  "pillow>=11.3,<13.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
jarvis-papa = "jarvis_papa.activity_desktop:run"
jarvis-papa-server = "jarvis_papa.main:run"
jarvis-native-host = "jarvis_papa.native_host:run"
jarvis-diagnostic = "jarvis_papa.diagnostics:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_papa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/jarvis_papa/activity_surface.py" = ["I001"]
"src/jarvis_papa/app.py" = ["F401"]
"src/jarvis_papa/agent.py" = ["F401", "UP035"]
"src/jarvis_papa/conversation.py" = ["I001"]
"src/jarvis_papa/correlation_governance.py" = ["I001"]
"src/jarvis_papa/dashboard.py" = ["I001"]
"src/jarvis_papa/desktop_app.py" = ["BLE001", "RUF100", "UP035"]
"src/jarvis_papa/email_intelligence.py" = ["I001"]
"src/jarvis_papa/procedural_memory.py" = ["RUF100"]
"src/jarvis_papa/professional_desktop.py" = ["BLE001", "I001", "UP035"]
"src/jarvis_papa/pronunciation.py" = ["I001"]
"src/jarvis_papa/runtime_intelligence.py" = ["F401"]
"src/jarvis_papa/system_reliability.py" = ["RUF012"]
"src/jarvis_papa/tooling.py" = ["BLE001", "I001", "UP035"]
"src/jarvis_papa/transactions.py" = ["UP035"]
"src/jarvis_papa/update_manager.py" = ["TRY004"]
"src/jarvis_papa/web_search.py" = ["BLE001"]
"packaging/*.py" = ["I001"]

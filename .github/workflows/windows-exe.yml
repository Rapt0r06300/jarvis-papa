name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/**"
      - "thunderbird-extension/**"
      - "tests/**"
      - "pyproject.toml"
      - ".env.example"
      - ".github/workflows/windows-exe.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q

      - name: Generate Windows icon
        run: python packaging/generate_icon.py

      - name: Build native Jarvis desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name Jarvis `
            --icon packaging/jarvis.ico `
            --version-file packaging/version_info.txt `
            --paths src `
            --add-data "src/jarvis_papa/voice/qwen_worker.py;jarvis_papa/voice" `
            packaging/desktop_entry.py

      - name: Build Thunderbird native host
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name JarvisNativeHost `
            --icon packaging/jarvis.ico `
            --version-file packaging/version_info.txt `
            --paths src `
            packaging/native_host_entry.py

      - name: Build graphical diagnostic executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name JarvisDiagnostic `
            --icon packaging/jarvis.ico `
            --version-file packaging/version_info.txt `
            --paths src `
            packaging/diagnostic_entry.py

      - name: Sign application executables when certificate is configured
        id: sign_apps
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -and `
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)
          if (-not $configured) {
            "status=UNSIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Authenticode certificate secrets are not configured; build remains explicitly unsigned."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "jarvis-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe x64 was not found on the Windows runner" }

          $targets = @(
            "dist\Jarvis\Jarvis.exe",
            "dist\JarvisNativeHost.exe",
            "dist\JarvisDiagnostic.exe"
          )
          foreach ($target in $targets) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $target" }
          }
          "status=SIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Smoke test graphical diagnostic
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath "dist\JarvisDiagnostic.exe" -PassThru
          try {
            Start-Sleep -Seconds 4
            if ($process.HasExited) {
              throw "JarvisDiagnostic.exe exited unexpectedly with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Smoke test packaged Jarvis.exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_SKIP_ONBOARDING: "1"
        run: |
          $qwenWorker = "dist\Jarvis\_internal\jarvis_papa\voice\qwen_worker.py"
          if (-not (Test-Path $qwenWorker)) { throw "Qwen worker is missing from Jarvis bundle" }
          $version = (Get-Item "dist\Jarvis\Jarvis.exe").VersionInfo.ProductVersion
          if (-not $version.StartsWith("0.7.0")) { throw "Jarvis.exe metadata version is invalid: $version" }
          $process = Start-Process -FilePath "dist\Jarvis\Jarvis.exe" -PassThru
          $healthy = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw "Jarvis.exe exited unexpectedly with code $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                if ($health.status -eq "ok") {
                  $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 2
                  if ($status.version -ne "0.7.0") { throw "Unexpected Jarvis version: $($status.version)" }
                  $maintenance = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/maintenance/status" -TimeoutSec 2
                  if (-not ($maintenance.PSObject.Properties.Name -contains "updates")) {
                    throw "Maintenance reliability contract is missing from packaged app"
                  }
                  $openapi = Invoke-RestMethod -Uri "http://127.0.0.1:8765/openapi.json" -TimeoutSec 2
                  $paths = @($openapi.paths.PSObject.Properties.Name)
                  if ($paths -notcontains "/api/advanced/browser/workflow") {
                    throw "Multi-step browser workflow route is missing from packaged app"
                  }
                  if ($paths -notcontains "/api/maintenance/restore") {
                    throw "Protected restore route is missing from packaged app"
                  }
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) { throw "Jarvis.exe did not expose its local service in time" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package Thunderbird extension
        shell: pwsh
        run: |
          $zip = "dist/jarvis-papa-thunderbird.zip"
          $xpi = "dist/jarvis-papa-thunderbird.xpi"
          Remove-Item $zip, $xpi -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "thunderbird-extension/*" -DestinationPath $zip -Force
          Move-Item $zip $xpi -Force

      - name: Validate final-PC diagnostic script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\validate_final_pc.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Final-PC validation script contains PowerShell syntax errors"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Jarvis-Setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "packaging\JarvisPapa.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Sign installer when certificate is configured
        id: sign_installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ("${{ steps.sign_apps.outputs.status }}" -ne "SIGNED") {
            "status=UNSIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "jarvis-signing.pfx"
          if (-not (Test-Path $pfx)) { throw "Temporary signing certificate is missing" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe x64 was not found on the Windows runner" }
          & $signtool.FullName sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD `
            "installer-output\Jarvis-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for installer" }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          "status=SIGNED" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Clean Windows install uninstall reinstall E2E
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_SKIP_ONBOARDING: "1"
        run: |
          $setup = (Resolve-Path "installer-output\Jarvis-Setup.exe").Path
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $installDir = Join-Path $env:RUNNER_TEMP "JarvisInstalled"
          $dataDir = Join-Path $env:LOCALAPPDATA "JarvisPapa"
          $legacyEnv = Join-Path $dataDir ".env"
          $startupKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue

          function Install-Jarvis {
            $installer = Start-Process -FilePath $setup -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
            ) -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw "Installer failed with code $($installer.ExitCode)" }
            $installedExe = Join-Path $installDir "Jarvis.exe"
            if (-not (Test-Path $installedExe)) { throw "Installed Jarvis.exe is missing" }
            $installedQwenWorker = Join-Path $installDir "_internal\jarvis_papa\voice\qwen_worker.py"
            if (-not (Test-Path $installedQwenWorker)) { throw "Installed Qwen worker is missing" }
            if (Test-Path $legacyEnv) { throw "Fresh install recreated legacy plaintext .env" }

            $cachedInstaller = Join-Path $dataDir "runtime\updates\current-installer.exe"
            if (-not (Test-Path $cachedInstaller)) { throw "Rollback cache is missing current installer" }
            $cachedHash = (Get-FileHash $cachedInstaller -Algorithm SHA256).Hash
            if ($cachedHash -ne $setupHash) { throw "Cached installer hash differs from source setup" }

            $startupCommand = (Get-ItemProperty -Path $startupKey -Name "Jarvis Papa" -ErrorAction Stop)."Jarvis Papa"
            if ([string]::IsNullOrWhiteSpace($startupCommand) -or $startupCommand -notlike "*$installedExe*") {
              throw "Per-user autostart registry entry is missing or points elsewhere"
            }
            return $installedExe
          }

          function Assert-JarvisHealthy([string]$installedExe) {
            $process = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
            $healthy = $false
            try {
              for ($i = 0; $i -lt 60; $i++) {
                if ($process.HasExited) { throw "Installed Jarvis.exe exited unexpectedly" }
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                  if ($health.status -eq "ok") {
                    $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 2
                    if ($status.version -ne "0.7.0") { throw "Installed Jarvis version mismatch" }
                    $maintenance = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/maintenance/status" -TimeoutSec 2
                    if (-not ($maintenance.PSObject.Properties.Name -contains "restore")) {
                      throw "Installed Jarvis is missing maintenance status"
                    }
                    $openapi = Invoke-RestMethod -Uri "http://127.0.0.1:8765/openapi.json" -TimeoutSec 2
                    $paths = @($openapi.paths.PSObject.Properties.Name)
                    if ($paths -notcontains "/api/advanced/browser/workflow") {
                      throw "Installed Jarvis is missing advanced browser workflow route"
                    }
                    if ($paths -notcontains "/api/maintenance/updates/install") {
                      throw "Installed Jarvis is missing protected update install route"
                    }
                    $healthy = $true
                    break
                  }
                } catch {
                  Start-Sleep -Milliseconds 500
                }
              }
              if (-not $healthy) { throw "Installed Jarvis.exe never became healthy" }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          function Uninstall-Jarvis {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $uninstaller)) { throw "Jarvis uninstaller is missing" }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            ) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with code $($uninstall.ExitCode)" }
            Start-Sleep -Seconds 1
            if (Test-Path (Join-Path $installDir "Jarvis.exe")) {
              throw "Jarvis.exe remained after uninstall"
            }
            $startupProperty = Get-ItemProperty -Path $startupKey -Name "Jarvis Papa" -ErrorAction SilentlyContinue
            if ($null -ne $startupProperty) { throw "Autostart registry entry remained after uninstall" }
          }

          $firstExe = Install-Jarvis
          Assert-JarvisHealthy $firstExe
          $sentinel = Join-Path $dataDir "runtime\e2e-preserve.txt"
          "preserve-me" | Set-Content $sentinel -Encoding utf8
          Uninstall-Jarvis
          if (-not (Test-Path $sentinel)) { throw "User runtime data was removed during uninstall" }

          $secondExe = Install-Jarvis
          if ((Get-Content $sentinel -Raw).Trim() -ne "preserve-me") {
            throw "User runtime data did not survive reinstall"
          }
          Assert-JarvisHealthy $secondExe
          Uninstall-Jarvis

      - name: Verify Authenticode status and Windows deliverables
        shell: pwsh
        run: |
          $files = @(
            "dist\Jarvis\Jarvis.exe",
            "dist\JarvisNativeHost.exe",
            "dist\JarvisDiagnostic.exe",
            "installer-output\Jarvis-Setup.exe"
          )
          $signingExpected = "${{ steps.sign_apps.outputs.status }}" -eq "SIGNED"
          $statusLines = @()
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing deliverable: $file" }
            $size = (Get-Item $file).Length
            if ($size -lt 100000) { throw "Deliverable looks invalid: $file ($size bytes)" }
            $signature = Get-AuthenticodeSignature -FilePath $file
            $statusLines += "$file`t$($signature.Status)`t$($signature.SignerCertificate.Subject)"
            if ($signingExpected -and $signature.Status -ne "Valid") {
              throw "Expected a valid Authenticode signature for $file, got $($signature.Status)"
            }
          }
          if ($signingExpected -and "${{ steps.sign_installer.outputs.status }}" -ne "SIGNED") {
            throw "Application binaries were signed but installer was not signed"
          }
          $headline = if ($signingExpected) { "SIGNED" } else { "UNSIGNED_CERTIFICATE_NOT_CONFIGURED" }
          @($headline) + $statusLines | Set-Content "installer-output\signing-status.txt" -Encoding utf8

          $manifest = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += "$hash  $file"
          }
          $manifest | Set-Content "installer-output\deliverables.sha256" -Encoding ascii
          $setupHash = (Get-FileHash "installer-output\Jarvis-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  Jarvis-Setup.exe" | Set-Content "installer-output\Jarvis-Setup.exe.sha256" -Encoding ascii

      - name: Upload final Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-0.7.0
          path: |
            installer-output/Jarvis-Setup.exe
            installer-output/Jarvis-Setup.exe.sha256
            installer-output/deliverables.sha256
            installer-output/signing-status.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary closure branch after successful main build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/closure/grand-run-20260902" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Temporary branch is already absent or could not be deleted; main remains authoritative."
          }

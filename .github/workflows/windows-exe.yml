name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "thunderbird-extension/**"
      - "pyproject.toml"
      - ".env.example"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Generate Windows icon
        run: python packaging/generate_icon.py

      - name: Build native Jarvis Papa desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name JarvisPapa `
            --icon packaging/jarvis.ico `
            --version-file packaging/version_info.txt `
            --paths src `
            --add-data "src/jarvis_papa/voice/qwen_worker.py;jarvis_papa/voice" `
            packaging/desktop_entry.py

      - name: Build Thunderbird native host
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name JarvisNativeHost `
            --icon packaging/jarvis.ico `
            --version-file packaging/version_info.txt `
            --paths src `
            packaging/native_host_entry.py

      - name: Build graphical diagnostic executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name JarvisDiagnostic `
            --icon packaging/jarvis.ico `
            --version-file packaging/version_info.txt `
            --paths src `
            packaging/diagnostic_entry.py

      - name: Smoke test graphical diagnostic
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath "dist\JarvisDiagnostic.exe" -PassThru
          try {
            Start-Sleep -Seconds 4
            if ($process.HasExited) {
              throw "JarvisDiagnostic.exe exited unexpectedly with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Smoke test packaged JarvisPapa.exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_SKIP_ONBOARDING: "1"
        run: |
          $qwenWorker = "dist\JarvisPapa\_internal\jarvis_papa\voice\qwen_worker.py"
          if (-not (Test-Path $qwenWorker)) { throw "Qwen worker is missing from Jarvis Papa bundle" }
          $version = (Get-Item "dist\JarvisPapa\JarvisPapa.exe").VersionInfo.ProductVersion
          if (-not $version.StartsWith("0.6.0")) { throw "JarvisPapa.exe metadata version is invalid: $version" }
          $process = Start-Process -FilePath "dist\JarvisPapa\JarvisPapa.exe" -PassThru
          $healthy = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) {
                throw "JarvisPapa.exe exited unexpectedly with code $($process.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                if ($health.status -eq "ok") {
                  $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 2
                  if ($status.version -ne "0.6.0") { throw "Unexpected Jarvis version: $($status.version)" }
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) { throw "JarvisPapa.exe did not expose its local service in time" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package Thunderbird extension
        shell: pwsh
        run: |
          $zip = "dist/jarvis-papa-thunderbird.zip"
          $xpi = "dist/jarvis-papa-thunderbird.xpi"
          Remove-Item $zip, $xpi -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "thunderbird-extension/*" -DestinationPath $zip -Force
          Move-Item $zip $xpi -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build JarvisPapa-Setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "packaging\JarvisPapa.iss"

      - name: Clean Windows install uninstall reinstall E2E
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_SKIP_ONBOARDING: "1"
        run: |
          $setup = (Resolve-Path "installer-output\JarvisPapa-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "JarvisPapaInstalled"
          $legacyEnv = Join-Path $env:LOCALAPPDATA "JarvisPapa\.env"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $legacyEnv -Force -ErrorAction SilentlyContinue

          function Install-Jarvis {
            $installer = Start-Process -FilePath $setup -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
            ) -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw "Installer failed with code $($installer.ExitCode)" }
            $installedExe = Join-Path $installDir "JarvisPapa.exe"
            if (-not (Test-Path $installedExe)) { throw "Installed JarvisPapa.exe is missing" }
            $installedQwenWorker = Join-Path $installDir "_internal\jarvis_papa\voice\qwen_worker.py"
            if (-not (Test-Path $installedQwenWorker)) { throw "Installed Qwen worker is missing" }
            if (Test-Path $legacyEnv) { throw "Fresh install recreated legacy plaintext .env" }
            return $installedExe
          }

          function Assert-JarvisHealthy([string]$installedExe) {
            $process = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
            $healthy = $false
            try {
              for ($i = 0; $i -lt 60; $i++) {
                if ($process.HasExited) { throw "Installed JarvisPapa.exe exited unexpectedly" }
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 1
                  if ($health.status -eq "ok") { $healthy = $true; break }
                } catch {
                  Start-Sleep -Milliseconds 500
                }
              }
              if (-not $healthy) { throw "Installed JarvisPapa.exe never became healthy" }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          function Uninstall-Jarvis {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $uninstaller)) { throw "Jarvis uninstaller is missing" }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            ) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with code $($uninstall.ExitCode)" }
            Start-Sleep -Seconds 1
            if (Test-Path (Join-Path $installDir "JarvisPapa.exe")) {
              throw "JarvisPapa.exe remained after uninstall"
            }
          }

          $firstExe = Install-Jarvis
          Assert-JarvisHealthy $firstExe
          Uninstall-Jarvis

          $secondExe = Install-Jarvis
          Assert-JarvisHealthy $secondExe
          Uninstall-Jarvis

      - name: Verify Windows deliverables and create checksum
        shell: pwsh
        run: |
          $files = @(
            "dist\JarvisPapa\JarvisPapa.exe",
            "dist\JarvisNativeHost.exe",
            "dist\JarvisDiagnostic.exe",
            "installer-output\JarvisPapa-Setup.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing deliverable: $file" }
            $size = (Get-Item $file).Length
            if ($size -lt 100000) { throw "Deliverable looks invalid: $file ($size bytes)" }
            Write-Host "OK $file - $size bytes"
          }
          $hash = (Get-FileHash "installer-output\JarvisPapa-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  JarvisPapa-Setup.exe" | Set-Content "installer-output\JarvisPapa-Setup.exe.sha256" -Encoding ascii
          Write-Host "SHA256 $hash"

      - name: Upload final Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JarvisPapa-Setup-0.6.0
          path: |
            installer-output/JarvisPapa-Setup.exe
            installer-output/JarvisPapa-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
